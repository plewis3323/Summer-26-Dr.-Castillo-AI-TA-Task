ai_summary: >
  Hyperbolic-orbit equation for Coulomb scattering (E > 0):
  1/r = C[1 + ε cos(θ − θ')], with C = mk/l^2 and eccentricity
  ε = [1 + 2El^2/(mk^2)]^{1/2} = [1 + (2sE/(ZZ'e^2))^2]^{1/2} > 1, using
  l = s sqrt(2mE). Splits into two situations: repulsive (ZZ' > 0, k < 0) and
  attractive (ZZ' < 0, k > 0; also gravity with k = G m_1 m_2).
