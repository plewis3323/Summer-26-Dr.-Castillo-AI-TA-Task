ai_summary: >
  Defines incident intensity I (particles per unit time per unit beam area) and the
  differential cross section via σ(Ω) dΩ = (# scattered into dΩ per time)/I. Flux
  conservation on a ring of impact parameters, I(2πs)|ds| = I σ(θ) 2π sin θ |dθ|,
  gives σ(θ) = (s/sin θ)|ds/dθ|. Also defines the total cross section σ_T = ∫ dΩ σ(Ω).
