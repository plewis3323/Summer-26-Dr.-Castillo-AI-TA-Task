ai_summary: >
  Universal computation of the apsidal angle ψ for any central potential. Starts from
  energy conservation E = (1/2) m ṙ^2 + V(r) + l^2/(2 m r^2), solves for ṙ, uses
  l = m r^2 θ̇ to get dθ, and substitutes l = s sqrt(2mE). Yields
  ψ = ∫_{r_m}^{∞} s r^{-2} dr / sqrt(1 − V(r)/E − s^2/r^2); the substitution u = 1/r
  gives ψ = ∫_0^{u_m} s du / sqrt(1 − V(u)/E − s^2 u^2).
