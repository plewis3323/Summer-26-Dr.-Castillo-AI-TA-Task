ai_summary: >
  Combines the repulsive and attractive results. From 1/ε = sin(θ/2),
  cot^2(θ/2) = 1/sin^2(θ/2) − 1 = ε^2 − 1 = (2sE/(ZZ'e^2))^2, so
  s(θ,E) = |ZZ'e^2/(2E)| cot(θ/2). Then ds/dθ = −|ZZ'e^2/(4E)| csc^2(θ/2), and
  σ(θ) = (s/sin θ)|ds/dθ| gives the boxed Rutherford cross section
  σ(θ) = (1/4)(ZZ'e^2/(2E))^2 csc^4(θ/2).
