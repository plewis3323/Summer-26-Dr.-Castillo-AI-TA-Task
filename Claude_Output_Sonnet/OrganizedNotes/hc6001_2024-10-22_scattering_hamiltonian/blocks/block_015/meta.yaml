ai_summary: >
  Legendre transformation to change variables from (q, q̇) to (q, p). For f(x,y),
  df = (∂f/∂x)dx + (∂f/∂y)dy. Thermodynamics example (fluid at fixed N): first law
  dU = δQ + δW = T dS − p dV with U = U(S,V); defining Helmholtz free energy A = U − TS
  gives dA = −S dT − p dV, so A = A(T,V). General transform (x,y) → (u,y): with
  u = ∂f/∂x, v = ∂f/∂y and g = f − ux, dg = −x du + v dy, so g = g(u,y).
