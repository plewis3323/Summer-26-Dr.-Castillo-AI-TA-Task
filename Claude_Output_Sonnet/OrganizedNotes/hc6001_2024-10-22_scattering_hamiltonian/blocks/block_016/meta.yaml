ai_summary: >
  Applies the Legendre transform to L with p_i = ∂L/∂q̇_i, defining
  H = Σ_i p_i q̇_i − L (written as H = −(L − Σ_i p_i q̇_i)). Expanding dL and
  d(Σ p_i q̇_i) gives dH = −(∂L/∂t)dt + Σ_i (q̇_i dp_i − (∂L/∂q_i) dq_i), so
  H = H(p_1,...,p_n, q_1,...,q_n, t).
