ai_summary: >
  Notation and long-range-potential remarks. Goldstein writes σ(Ω) and σ_T where other
  texts write dσ/dΩ and σ. Classically σ_T = +∞ for any long-range potential; quantum
  mechanically σ_T = +∞ for some long-range potentials that do not decay fast enough as
  r → ∞. Caveat: in a dense conducting material the Coulomb potential becomes a screened
  (Yukawa) potential V_screen(r) = −(k/r) e^{−r/λ}; in non-conducting materials the form
  may differ but still vanishes much faster than 1/r.
